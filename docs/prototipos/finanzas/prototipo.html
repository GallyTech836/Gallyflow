<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · Prototipo de Dashboard, Finanzas y Analítica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#09090B}a:hover{color:#52525B}
.pal-negro{--primary:#18181B;--primary-h:#3F3F46;--navy:#09090B;--navy-soft:#27272A;--bg:#FAFAFA;--surface:#FFFFFF;--surface-h:#F4F4F5;--border:#E4E4E7;--tx:#09090B;--tx2:#52525B;--ring:rgba(24,24,27,.22);--c-in:#18181B;--c-out:#A1A1AA}
.pal-azul{--primary:#0F6FFF;--primary-h:#0B5CD9;--navy:#16233A;--navy-soft:#1F3049;--bg:#F8FAFC;--surface:#FFFFFF;--surface-h:#F1F5F9;--border:#E9EDF2;--tx:#0F172A;--tx2:#5B6B82;--ring:rgba(15,111,255,.22);--c-in:#0F6FFF;--c-out:#94A3B8}
.nx{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic-s{width:16px;height:16px}
.side{flex:1 1 240px;background:var(--navy);color:#fff;display:flex;flex-direction:column}
.brand{height:64px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:36px;height:36px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.bt{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em}
.bsub{margin:0;font-size:12px;color:rgba(255,255,255,.55)}
.nav{padding:12px;display:flex;flex-direction:column;gap:4px}
.sec{margin:0;padding:16px 12px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.sec.first{padding-top:0}
.it{width:100%;height:40px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:rgba(255,255,255,.78);font:inherit;font-weight:500;cursor:pointer;text-align:left}
.it:hover{background:var(--navy-soft);color:#fff}
.it .ic{color:rgba(255,255,255,.62)}
.it.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.it.on .ic{color:var(--tx)}
.it.dim{color:rgba(255,255,255,.55)}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ht{margin:0;font-size:18px;line-height:28px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ht span.biz{font-weight:400;color:var(--tx2)}
.content{padding:20px 24px 56px;width:100%;max-width:1200px;display:flex;flex-direction:column;gap:16px}
.demo{display:flex;gap:10px;align-items:flex-start;background:var(--surface-h);color:var(--tx2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.06);padding:20px;min-width:0}
.ch{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ct{margin:0;font-size:16px;line-height:24px;font-weight:600}
.cs{margin:2px 0 0;font-size:13px;color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--tx2);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--tx);border-color:var(--tx2)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);background:var(--surface-h);border-radius:8px;padding:2px;flex-wrap:wrap}
.sb{height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--tx2);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.sb.on{background:var(--surface);color:var(--tx);box-shadow:0 1px 2px rgba(15,23,42,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid transparent;text-decoration:none}
.bp{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(15,23,42,.12)}
.bp:hover{background:var(--primary-h)}
.bs{background:var(--surface);color:var(--tx);border-color:var(--border)}
.bs:hover{background:var(--surface-h)}
.bg{background:transparent;color:var(--tx2)}
.bg:hover{background:var(--surface-h);color:var(--tx)}
.sm{height:36px;padding:0 12px;font-size:13px}
.lg{height:48px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:transparent;padding:0;font:inherit;font-weight:600;color:var(--tx);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.bdg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:999px;border:1px solid;padding:0 8px;font-size:12px;font-weight:500;line-height:20px}
.t-n{background:var(--surface-h);color:var(--tx2);border-color:var(--border)}
.t-s{background:#ECFDF5;color:#047857;border-color:rgba(16,185,129,.3)}
.t-w{background:var(--surface-h);color:var(--tx);border-color:var(--tx2)}
.t-d{background:#FEF2F2;color:#B91C1C;border-color:rgba(239,68,68,.3)}
.t-i{background:var(--surface-h);color:var(--tx2);border-color:var(--border)}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kl{margin:0;font-size:12px;font-weight:500;color:var(--tx2)}
.kv{margin:6px 0 0;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em}
.ks{margin:4px 0 0;font-size:12px;color:var(--tx2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.hero{display:flex;flex-direction:column;gap:6px}
.hs{margin:0;font-size:22px;line-height:32px;font-weight:600;letter-spacing:-.01em}
.hs b{font-weight:700}
.gan{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:10px}
.gv{margin:0;font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.calc{margin-top:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:6px;max-width:460px}
.cr{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.cr.t{border-top:1px solid var(--border);padding-top:6px;font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.lt{margin:0;font-weight:600}
.ls{margin:2px 0 0;font-size:12px;line-height:16px;color:var(--tx2)}
.la{display:flex;align-items:center;gap:10px;flex-shrink:0}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:#047857;font-weight:600}
.okc{color:#047857}
.neg{color:#B91C1C}
.mut{color:var(--tx2);font-size:12px;line-height:16px}
.b6{font-weight:600}
.chart{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:8px;border-bottom:1px solid var(--border)}
.mo{flex:1 1 0;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%;min-width:0}
.bar{width:18px;border-radius:4px 4px 0 0}
.mlab{display:flex;gap:12px;margin-top:8px}
.mlab div{flex:1 1 0;text-align:center;min-width:0}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(120px,170px) 1fr 70px;align-items:center;gap:12px;font-size:13px;padding:6px 0}
.track{height:10px;border-radius:999px;background:var(--surface-h);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--primary)}
.lbl{display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:6px}
.q{margin:0 0 8px;font-size:14px;font-weight:600}
.inp{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--tx);font:inherit;font-size:15px;padding:0 12px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.inp.big{height:56px;font-size:24px;font-weight:700}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ovb{position:absolute;inset:0;width:100%;height:100%;background:rgba(9,9,11,.6);border:0;cursor:default}
.md{position:relative;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:0 12px 32px rgba(15,23,42,.18)}
.md.wide{max-width:680px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.mt{margin:0;font-size:16px;line-height:24px;font-weight:600}
.mb{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.note{margin:0;border-radius:8px;padding:10px 12px;font-size:13px;line-height:18px;background:var(--bg);border:1px solid var(--border);color:var(--tx2)}
.note.info{background:var(--bg);border-color:var(--border);color:var(--tx2)}
.err{margin:0;color:#B91C1C;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.25);max-width:92%;width:max-content}
.x{width:36px;height:36px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.x:hover{background:var(--surface-h);color:var(--tx)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font:inherit;color:var(--tx);text-align:left;width:100%}
.sw{width:40px;height:24px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--primary)}
.sw.on i{left:19px}
.prow{display:grid;grid-template-columns:minmax(160px,1.6fr) repeat(3,minmax(90px,1fr)) 96px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);min-width:640px}
.prow.h{font-size:12px;font-weight:600;color:var(--tx2);padding:8px 0}
.prow:last-child{border-bottom:0}
.r{text-align:right;justify-self:end}
.scroll{overflow-x:auto}
.irow{display:grid;grid-template-columns:minmax(200px,2fr) 90px 100px 110px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);min-width:560px}
.irow.h{font-size:12px;font-weight:600;color:var(--tx2);padding:8px 0}
.irow.hl{background:var(--surface-h)}
.brow{display:grid;grid-template-columns:minmax(180px,2fr) 90px 110px 100px 36px;gap:10px;align-items:center;min-width:560px}
.av{width:36px;height:36px;border-radius:999px;background:var(--surface-h);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.fade{color:var(--tx2)}
.bebar{position:relative;height:14px;border-radius:999px;background:var(--surface-h);margin-top:20px;overflow:visible}
.befill{height:100%;border-radius:999px;background:var(--primary)}
.befill.ok{background:#10B981}
.bemark{position:absolute;top:-6px;width:2px;height:26px;background:var(--tx);border-radius:2px}
.belab{position:relative;height:18px;margin-top:6px}
.crow{display:grid;grid-template-columns:minmax(180px,1.6fr) 90px 130px 110px 110px 200px;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);min-width:880px}
.crow.h{font-size:12px;font-weight:600;color:var(--tx2);background:var(--bg);padding:10px 20px;border-radius:12px 12px 0 0}
.crow:last-child{border-bottom:0}
.mrow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border)}
.mrow:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--bg);border:1px solid var(--border);font-size:14px;font-weight:500}
.srow{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--border);border-radius:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ac{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;min-width:0}
.big{margin:0;font-size:30px;line-height:36px;font-weight:800}
.duo{display:flex;justify-content:center;gap:24px;font-size:14px}
.duo span{display:flex;flex-direction:column;align-items:center;color:var(--tx2)}
.duo b{font-size:18px;color:var(--tx)}
.dr{display:flex;align-items:baseline;gap:8px;font-size:14px}
.dr b{white-space:nowrap}
.dash{flex:1;border-bottom:1px dashed var(--border);transform:translateY(-4px)}
.vbars{display:flex;align-items:flex-end;gap:14px;height:240px;border-bottom:1px solid var(--border);padding:0 6px}
.vb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.vbf{width:70%;background:var(--primary);border-radius:4px 4px 0 0}
.prohead{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:6px}
.tri{display:flex;align-items:center;gap:12px}
.tic{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tic.in{background:#ECFDF5;color:#047857}
.tic.out{background:var(--surface-h);color:var(--tx2)}
.tic.gn{background:var(--primary);color:#fff}
.stack{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--surface-h)}
.seg-b{height:100%;min-width:3px}
.seg-b + .seg-b{border-left:2px solid #fff}
.sleg{display:flex;flex-wrap:wrap;gap:20px;margin-top:10px}
.sl{display:flex;gap:2px;align-items:flex-start}
.sl .dot{margin-top:4px}
@media (max-width:900px){.g3,.g4,.trio{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>*{grid-column:auto!important}}
@media (max-width:560px){.g3,.g4,.trio{grid-template-columns:1fr}}
@media (max-width:640px){.hdr{padding:12px 16px}.content{padding:16px 16px 48px}.card{padding:16px}.hs{font-size:19px;line-height:28px}}
</style>
</head>

<button type="button" class="{{nav.dash}}" onClick="{{go.dash}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg><span>Dashboard</span></button>
<button type="button" class="it dim" onClick="{{outside}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="m16 11 2 2 4-4"></path></svg><span>Clientes</span></button>
<p class="sec">Gestión</p>
<button type="button" class="it dim" onClick="{{outside}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Barberos</span></button>
<button type="button" class="it dim" onClick="{{outside}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"></path></svg><span>Servicios</span></button>
<button type="button" class="{{nav.inv}}" onClick="{{go.inv}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5M12 22V12"></path></svg><span>Inventario</span></button>
<p class="sec">Finanzas</p>
<button type="button" class="{{nav.fin}}" onClick="{{go.fin}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg><span>Finanzas</span></button>
<button type="button" class="{{nav.com}}" onClick="{{go.com}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span>Comisiones</span></button>
<button type="button" class="{{nav.ana}}" onClick="{{go.ana}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg><span>Analíticas</span></button>
<p class="sec">Sistema</p>
<button type="button" class="it dim" onClick="{{confOutside}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"></path></svg><span>Configuración</span></button>
</nav>
</aside>

<main class="main">
<header class="hdr">
<h2 class="ht"><span class="biz">Barbería Demo ·</span>{{pageTitle}}<sc-if value="{{isFin}}" hint-placeholder-val="{{false}}"><span class="bdg t-n"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px;"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Con PIN</span></sc-if></h2>
<sc-if value="{{hasPeriod}}" hint-placeholder-val="{{true}}">
<div class="seg" role="radiogroup" aria-label="Periodo"><sc-for list="{{periodOpts}}" as="p" hint-placeholder-count="2"><button type="button" role="radio" class="{{p.cls}}" aria-checked="{{p.on}}" onClick="{{p.pick}}">{{p.label}}</button></sc-for></div>
</sc-if>
</header>

<div class="content">
<div class="demo" role="note"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px;"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg><span><b>Prototipo con datos de ejemplo.</b> Puedes tocar todo: nada se guarda y al recargar vuelve a empezar.</span></div>

<!-- ================= DASHBOARD ================= -->
<sc-if value="{{isDash}}" hint-placeholder-val="{{true}}">
<div class="kg">
<sc-for list="{{dashKpis}}" as="k" hint-placeholder-count="3">
<div class="card" style="padding: 14px 16px;"><p class="kl">{{k.label}}</p><p class="{{k.vcls}}">{{k.value}}</p><p class="{{k.scls}}">{{k.sub}}</p></div>
</sc-for>
</div>
<div class="g3">
<section class="card" style="grid-column: span 2;">
<div class="ch" style="align-items: center;"><h3 class="ct">Citas del periodo</h3><span class="bdg t-n">Tiempo real</span></div>
<svg viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="Citas del periodo" style="width: 100%; height: 210px; display: block;">
<line x1="0" y1="50" x2="600" y2="50" stroke="var(--border)" stroke-dasharray="3 3"></line><line x1="0" y1="100" x2="600" y2="100" stroke="var(--border)" stroke-dasharray="3 3"></line><line x1="0" y1="150" x2="600" y2="150" stroke="var(--border)" stroke-dasharray="3 3"></line>
<path d="{{chart.area}}" fill="var(--primary)" fill-opacity="0.08"></path>
<path d="{{chart.line}}" fill="none" stroke="var(--primary)" stroke-width="2"></path>
</svg>
<div style="display: flex; justify-content: space-between; margin-top: 6px;"><sc-for list="{{chart.labels}}" as="l" hint-placeholder-count="7"><span class="mut">{{l}}</span></sc-for></div>
</section>
<section class="card" style="display: flex; flex-direction: column;">
<h3 class="ct" style="margin-bottom: 12px;">Próxima cita</h3>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
<span class="num" style="font-size: 30px; line-height: 36px; font-weight: 700;">15:30</span>
<span class="b6" style="font-size: 16px; margin-top: 8px;">Luis Suárez</span>
<span class="fade" style="margin-top: 2px;">Corte + barba</span>
<span class="mut" style="margin-top: 4px;">Carlos Méndez</span>
</div>
</section>
</div>
<section class="card">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px;"><h3 class="ct" style="display: flex; align-items: center; gap: 8px;"><svg class="ic ic-s" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--tx2);"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>Caja · Centro</h3><span class="{{caja.badgeCls}}">{{caja.badge}}</span></div>
<p class="mut" style="margin: 0 0 14px;">{{caja.status}}</p>
<div class="row2">
<div><p class="kl">Efectivo esperado</p><p class="kv num" style="margin-top: 2px;">{{caja.expected}}</p><p class="mut" style="margin: 2px 0 0;">Fondo {{caja.fund}} · salidas {{caja.outPlain}}</p></div>
<div><p class="kl">Ventas del día</p><p class="kv num" style="margin-top: 2px;">{{caja.sales}}</p><p class="mut" style="margin: 2px 0 0;">27 cobros, todos los métodos</p></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; margin: 14px 0;">
<sc-for list="{{byMethod}}" as="m" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; font-size: 14px;"><span class="fade">{{m.label}}</span><span class="amt">{{m.value}}</span></div></sc-for>
</div>
<div class="chips">
<button type="button" class="btn bp sm" onClick="{{closeCaja}}" disabled="{{caja.closed}}">{{caja.closeLabel}}</button>
<button type="button" class="btn bs sm" onClick="{{openSalida}}" disabled="{{caja.closed}}">Salida de efectivo</button>
<button type="button" class="btn bg sm" onClick="{{outside}}">Cierres</button>
</div>
</section>
<section class="card">
<h3 class="ct" style="margin-bottom: 8px;">Actividad reciente</h3>
<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{activity}}" as="a" hint-placeholder-count="5"><p class="fade" style="margin: 0; font-size: 14px;"><span class="mut num" style="font-size: 14px;">{{a.time}}</span>  <b style="color: var(--tx); font-weight: 500;">{{a.client}}</b> — {{a.label}}</p></sc-for>
</div>
</section>
</sc-if>

<!-- ================= FINANZAS ================= -->
<sc-if value="{{isFin}}" hint-placeholder-val="{{false}}">
<div class="chips" role="tablist" aria-label="Secciones de Finanzas">
<sc-for list="{{finTabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>

<sc-if value="{{isResumen}}" hint-placeholder-val="{{true}}">
<section class="card hero">
<p class="kl" style="font-size: 13px;">{{res.monthName}}</p>
<div class="trio">
<div class="tri"><span class="tic in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></span><div><p class="kl">Entró</p><p class="kv num" style="margin-top: 0;">{{res.inc}}</p></div></div>
<div class="tri"><span class="tic out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"></path></svg></span><div><p class="kl">Salió</p><p class="kv num" style="margin-top: 0;">{{res.out}}</p></div></div>
<div class="tri"><span class="tic gn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M14 7h7v7"></path></svg></span><div><p class="kl">Ganancia aproximada</p><p class="kv num" style="margin-top: 0;">{{res.gain}}</p></div></div>
</div>
<div style="margin-top: 18px;">
<p class="kl" style="margin-bottom: 8px;">¿A dónde va lo que entró?</p>
<div class="stack" role="img" aria-label="{{res.stackLabel}}">
<sc-for list="{{res.segs}}" as="g" hint-placeholder-count="3"><div class="seg-b" style="width: {{g.w}}%; background: {{g.color}};" title="{{g.tip}}"></div></sc-for>
</div>
<div class="sleg">
<sc-for list="{{res.segs}}" as="g" hint-placeholder-count="3"><div class="sl"><i class="dot" style="background: {{g.color}};"></i><div><p class="b6" style="margin: 0; font-size: 13px;">{{g.label}} · {{g.pct}}</p><p class="mut num" style="margin: 0;">{{g.value}}</p></div></div></sc-for>
</div>
</div>
<p class="mut" style="margin: 10px 0 0;">{{res.gainNote}} <button type="button" class="link" style="font-size: 12px;" onClick="{{toggleCalc}}">{{res.calcLabel}}</button></p>
<sc-if value="{{showCalc}}" hint-placeholder-val="{{true}}">
<div class="calc">
<div class="cr"><span>Entró por servicios y productos</span><span class="num b6">{{res.inc}}</span></div>
<div class="cr"><span>− Comisiones del mes (pagadas o no)</span><span class="num">{{res.com}}</span></div>
<div class="cr"><span>− Gastos del mes (pagados o no)</span><span class="num">{{res.exp}}</span></div>
<div class="cr t"><span>Ganancia aproximada</span><span class="num">{{res.gain}}</span></div>
<p class="mut" style="margin: 4px 0 0;">Es una cuenta simple para el dueño, no un balance contable.</p>
</div>
</sc-if>
</section>
<div class="g2">
<section class="card">
<p class="kl">Tienes en caja y banco</p>
<p class="kv num">{{res.have}}</p>
<div class="list" style="margin-top: 8px;">
<sc-for list="{{accts}}" as="a" hint-placeholder-count="4"><div class="li" style="padding: 8px 0;"><span style="font-size: 13px;">{{a.name}}</span><span class="amt" style="font-size: 13px;">{{a.value}}</span></div></sc-for>
</div>
<p class="mut" style="margin: 8px 0 0;">No es la ganancia: es lo que tienes hoy.</p>
<div class="chips" style="margin-top: 10px;"><button type="button" class="btn bs sm" onClick="{{openSobre}}">Deposité el sobre en el banco</button><button type="button" class="btn bg sm" onClick="{{goCuentas}}">Administrar cuentas</button></div>
</section>
<section class="card">
<p class="kl">Tienes que pagar</p>
<p class="kv num">{{res.owe}}</p>
<div class="list" style="margin-top: 8px;">
<sc-for list="{{oweTop}}" as="o" hint-placeholder-count="3"><div class="li" style="padding: 8px 0;"><div><p class="lt" style="font-size: 13px;">{{o.title}}</p><p class="ls">{{o.when}}</p></div><span class="{{o.cls}}">{{o.badge}}</span></div></sc-for>
</div>
<button type="button" class="btn bs sm" style="margin-top: 10px;" onClick="{{goPagar}}">Ver y pagar</button>
</section>
</div>
<section class="card">
<div class="ch"><div><h3 class="ct">Entró y salió por mes</h3><p class="cs">Noviembre va hasta hoy, 13.</p></div><div class="leg"><span><i class="dot" style="background: var(--c-in);"></i>Entró</span><span><i class="dot" style="background: var(--c-out);"></i>Salió</span></div></div>
<div class="chart"><sc-for list="{{months}}" as="m" hint-placeholder-count="6"><div class="mo"><div class="bar" style="height: {{m.hIn}}px; background: var(--c-in);" title="{{m.tipIn}}"></div><div class="bar" style="height: {{m.hOut}}px; background: var(--c-out);" title="{{m.tipOut}}"></div></div></sc-for></div>
<div class="mlab"><sc-for list="{{months}}" as="m" hint-placeholder-count="6"><div><p class="b6" style="margin: 0; font-size: 12px;">{{m.label}}</p></div></sc-for></div>
</section>
<section class="card">
<div class="ch" style="margin-bottom: 4px;"><div><h3 class="ct">Historial</h3><p class="cs">Todo lo que entró y salió, con su origen</p></div></div>
<div class="list">
<sc-for list="{{hist}}" as="h" hint-placeholder-count="8"><div class="li"><div style="min-width: 0;"><p class="lt">{{h.title}}</p><p class="ls">{{h.sub}}</p></div><span class="{{h.cls}}">{{h.value}}</span></div></sc-for>
</div>
<sc-if value="{{histMore}}" hint-placeholder-val="{{true}}"><button type="button" class="btn bs sm" style="margin-top: 10px;" onClick="{{showAllHist}}">Ver todo ({{histCount}})</button></sc-if>
</section>
</sc-if>

<sc-if value="{{isGastos}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;">
<div class="seg" role="radiogroup" aria-label="Mostrar"><sc-for list="{{gFilters}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" class="{{o.cls}}" aria-checked="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<button type="button" class="btn bp lg" onClick="{{openGasto}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Registrar gasto</button>
</div>
<section class="card">
<div class="list">
<sc-for list="{{gRows}}" as="g" hint-placeholder-count="8">
<div class="li">
<div style="min-width: 0;"><p class="lt">{{g.title}}</p><p class="ls">{{g.sub}}</p></div>
<div class="la"><span class="amt">{{g.amount}}</span><span class="{{g.cls}}">{{g.badge}}</span><sc-if value="{{g.canPay}}" hint-placeholder-val="{{false}}"><button type="button" class="btn bs sm" onClick="{{g.pay}}">Pagar</button></sc-if></div>
</div>
</sc-for>
</div>
<sc-if value="{{gEmpty}}" hint-placeholder-val="{{false}}"><p class="cs" style="text-align: center; padding: 20px 0;">No tienes nada por pagar.</p></sc-if>
</section>
<p class="note">Las comisiones no se cargan aquí: están en su pestaña y cuentan solas en la ganancia.</p>
</sc-if>

<sc-if value="{{isCuentas}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;">
<div><button type="button" class="link" style="font-size: 13px;" onClick="{{goResumen}}">← Volver al resumen</button><h3 class="ct" style="margin-top: 6px;">Tus cuentas</h3><p class="cs">Dónde está tu plata y qué cobros llegan a cada una.</p></div>
<button type="button" class="btn bp" onClick="{{newAcct}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nueva cuenta</button>
</div>
<sc-if value="{{hasUnassigned}}" hint-placeholder-val="{{false}}"><p class="note" style="color: var(--tx); border-color: var(--tx2);">{{unassignedMsg}}</p></sc-if>
<section class="card" style="padding: 4px 20px;">
<div class="list">
<sc-for list="{{acctRows}}" as="a" hint-placeholder-count="4">
<div class="li">
<div style="display: flex; gap: 12px; align-items: center; min-width: 0;"><span class="av" style="border-radius: 10px;">{{a.ini}}</span><div style="min-width: 0;"><p class="lt">{{a.name}} <span class="{{a.typeCls}}" style="margin-left: 6px;">{{a.type}}</span></p><p class="ls">{{a.receives}}</p></div></div>
<div class="la"><span class="amt" style="font-size: 16px;">{{a.balance}}</span><button type="button" class="btn bs sm" onClick="{{a.edit}}">Editar</button></div>
</div>
</sc-for>
</div>
</section>
<p class="note">Para elegir qué cobros llegan a cada cuenta, toca Editar.</p>
</sc-if>

</sc-if>

<!-- ================= ANALÍTICA ================= -->
<sc-if value="{{isAna}}" hint-placeholder-val="{{false}}">
<section class="card">
<div class="ch" style="margin-bottom: 6px;"><div><h3 class="ct">Punto de equilibrio</h3><p class="cs">Lo que tienes que vender en el mes para no perder.</p></div><span class="{{be.badgeCls}}">{{be.badge}}</span></div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-top: 10px;">
<div><p class="kl">Vendido</p><p class="gv num">{{be.sold}}</p></div>
<div style="text-align: right;"><p class="kl">Meta del mes</p><p class="gv num fade">{{be.target}}</p><p class="mut" style="margin: 0;">{{be.targetSub}}</p></div>
</div>
<div class="bebar" role="img" aria-label="{{be.aria}}"><div class="{{be.fillCls}}" style="width: {{be.fillW}}%;"></div><div class="bemark" style="left: {{be.markL}}%;"></div></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px;">
<p class="{{be.soldCls}}" style="margin: 0; font-size: 14px;">{{be.soldSub}}</p>
<button type="button" class="link" style="font-size: 13px;" onClick="{{toggleBe}}">{{be.calcLabel}}</button>
</div>
<sc-if value="{{showBe}}" hint-placeholder-val="{{false}}">
<div class="calc" style="max-width: 420px;">
<div class="cr"><span>Gastos fijos del mes</span><span class="num b6">{{be.fixed}}</span></div>
<div class="cr"><span>De cada Bs 100 vendidos te quedan</span><span class="num b6">{{be.per100}}</span></div>
<div class="cr t"><span>Meta ({{be.fixed}} ÷ {{be.ratio}})</span><span class="num">{{be.target}}</span></div>
<p class="mut" style="margin: 2px 0 0;">Fijos = los gastos que se repiten cada mes.</p>
</div>
</sc-if>
</section>
<section>
<h3 class="ct" style="margin-bottom: 12px;">Reservas y clientes</h3>
<div class="g4">
<div class="ac"><p class="mut" style="margin: 0 0 6px;">Canales de reservas</p><div style="display: flex; flex-direction: column; gap: 6px;"><sc-for list="{{channels}}" as="c" hint-placeholder-count="3"><div class="dr"><b>{{c.name}}</b><span class="dash"></span><b>{{c.value}}</b></div></sc-for></div></div>
<div class="ac" style="text-align: center;"><p class="big">412</p><p class="mut" style="margin: 0 0 8px;">Reservas</p><div class="duo"><span><b>372</b>Completadas</span><span><b style="color: #B91C1C;">18</b>Canceladas</span></div></div>
<div class="ac" style="text-align: center;"><p class="big">341</p><p class="mut" style="margin: 0 0 8px;">Clientes atendidos</p><div class="duo"><span><b>299</b>Recurrentes</span><span><b>42</b>Nuevos</span></div></div>
<div class="ac" style="text-align: center;"><p class="big">1.284</p><p class="mut" style="margin: 0 0 8px;">Clientes totales</p><div class="duo"><span><b>512</b>activos</span><span><b>772</b>sin volver</span></div></div>
</div>
</section>
<section>
<h3 class="ct" style="margin-bottom: 12px;">Servicios</h3>
<div class="ac">
<p class="b6" style="margin: 0; font-size: 14px;">Gráfico de servicios</p>
<p class="mut" style="margin: 0 0 12px;">Ordenado por ingreso generado</p>
<div class="g2" style="gap: 20px;">
<div class="vbars"><sc-for list="{{services}}" as="c" hint-placeholder-count="5"><div class="vb"><div class="vbf" style="height: {{c.h}}px;" title="{{c.tip}}"></div><span class="mut" style="text-align: center;">{{c.short}}</span></div></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><sc-for list="{{services}}" as="c" hint-placeholder-count="5"><div><div class="dr"><b>{{c.name}}</b><span class="dash"></span><b>{{c.pct}}</b></div><p class="mut" style="margin: 0; padding-left: 4px;">{{c.detail}}</p></div></sc-for></div>
</div>
</div>
</section>
<section>
<h3 class="ct" style="margin-bottom: 12px;">Promociones</h3>
<div class="ac">

    var payInfo = { title: '', rem: '', when: '' };

    var comInfo = { name: '', pend: '', hint: '', acct: '', acctCls: 'mut' };
    if (s.modal === 'com') {

    }
    var comMethods = s.methods.map(function (m) { return chip('method', m.name, m.name); });
    var sa = num(f.amount) > 0 ? num(f.amount) : 0;
    var sobrePrev = 'Caja: ' + bs(bal.caja) + ' → ' + bs(bal.caja - sa) + '   ·   Banco BNB: ' + bs(bal.bnb) + ' → ' + bs(bal.bnb + sa);
    var items = f.items || [];
    var setItem = function (i, k) { return function (e) { var v = e.target.value; self.setF('items', items.map(function (it, j) { if (j !== i) return it; var o = Object.assign({}, it); o[k] = v; if (k === 'productId') { var p = s.products.find(function (x) { return x.id === v; }); o.cost = String(p ? p.cost : ''); } return o; })); }; };

    var buyTotal = s.modal === 'compra' ? this.buyLines().reduce(function (t, l) { return t + l.qty * l.cost; }, 0) : 0;

    return {
      palClass: pal, nav: nav, go: go, pageTitle: titles[s.view],
      outside: function () { self.say('Esa parte no está en este prototipo.'); },
      hasPeriod: s.view !== 'inv' && s.view !== 'conf' && !(isFin && s.finTab !== 'resumen'), periodOpts: periodOpts,
      isDash: s.view === 'dash', isFin: isFin, isAna: s.view === 'ana', isInv: s.view === 'inv', isCom: s.view === 'com', isConf: s.view === 'conf',
      isResumen: s.finTab === 'resumen', isGastos: s.finTab === 'gastos', isCuentas: s.finTab === 'cuentas', finTabs: finTabs,
      goCuentas: function () { goFin('cuentas'); }, goResumen: function () { self.setState({ finTab: 'resumen' }); },
      comRows: comRows, mDet: s.modal === 'det', detInfo: detInfo,
      methodRows: methodRows, newMethod: s.newMethod, setNewMethod: function (e) { self.setState({ newMethod: e.target.value }); }, addMethod: function () { self.addMethod(); },
      acctRows: acctRows, newAcct: function () { self.open('acct', { id: null, name: '', type: 'Banco', balance: '' }); },
      hasUnassigned: unassigned.length > 0, unassignedMsg: unassigned.join(', ') + (unassigned.length > 1 ? ' no tienen' : ' no tiene') + ' cuenta: lo cobrado así queda «Por asignar». Toca Editar en la cuenta donde llega y márcalo.',
      mSetup: s.modal === 'setup', setupRows: setupRows, setupNew: Object.keys(setupMap).some(function (k) { return setupMap[k] === '__new'; }),
      setupLater: function () { self.setState({ modal: null, view: 'dash' }); self.say('Te lo volveremos a preguntar la próxima vez que entres a Finanzas.'); },
      saveSetup: function () { self.saveSetup(); },
      mAcct: s.modal === 'acct', acctInfo: acctInfo, acctMethods: acctMethods, acctTypes: acctTypes, saveAcct: function () { self.saveAcct(); },
      toggleActive: function () { self.setF('active', !f.active); },
      dashKpis: dashKpis, caja: caja, byMethod: byMethod, chart: chart, activity: activity,
      comOutside: function () { self.say('Comisiones queda igual que hoy. Lo pagado llega solo a Finanzas.'); },
      openSalida: function () { self.open('gasto', { amount: '', desc: '', cat: 'Materiales', paid: 'si', acct: 'caja', due: '2026-11-25', repeat: false, day: '15', title: 'Salida de efectivo' }); },
      closeCaja: function () { self.closeCaja(); },
      openSobre: function () { self.open('sobre', { amount: String(Math.max(0, Math.round(bal.caja - 200))) }); },
      res: res, accts: accts, oweTop: oweTop, months: months, hist: hist, showCalc: s.showCalc,
      toggleCalc: function () { self.setState({ showCalc: !s.showCalc }); },
      histMore: !s.histAll && sorted.length > 8, histCount: sorted.length, showAllHist: function () { self.setState({ histAll: true }); },
      goPagar: function () { self.setState({ finTab: 'gastos', gFilter: 'pagar' }); },
      gFilters: seg([['todos', 'Todos'], ['pagar', 'Por pagar'], ['fijos', 'Se repiten cada mes']], s.gFilter, 'gFilter'),
      gRows: gRows, gEmpty: gRows.length === 0,
      openGasto: function () { self.open('gasto', { amount: '', desc: '', cat: 'Servicios', paid: 'si', acct: 'bnb', due: '2026-11-25', repeat: false, day: '15', title: 'Registrar gasto' }); },
      channels: channels, services: services, anaPros: anaPros,
      be: be, showBe: s.showBe, toggleBe: function () { self.setState({ showBe: !s.showBe }); },
      confOutside: function () { self.say('Configuración queda igual que en producción.'); },
      invRows: invRows,
      openCompra: function () { self.open('compra', { supplier: 'Insumos Barber SCZ', items: [{ productId: 'p2', qty: '6', cost: '42' }, { productId: 'p5', qty: '3', cost: '65' }], paid: 'si', acct: 'bnb', due: '2026-12-13' }); },
      mGasto: s.modal === 'gasto', mPay: s.modal === 'pay', mCom: s.modal === 'com', mSobre: s.modal === 'sobre', mCompra: s.modal === 'compra',
      close: function () { self.close(); }, form: f, fx: fx, err: s.err, hasErr: !!s.err,
      gTitle: f.title || 'Registrar gasto', gCats: gCats, gPaidOpts: gPaidOpts, gPaid: f.paid === 'si', gLater: f.paid === 'despues', acctChips: acctChips,
      toggleRepeat: function () { self.setF('repeat', !f.repeat); }, swCls: f.repeat ? 'sw on' : 'sw',
      saveGasto: function () { self.saveGasto(); },
      payInfo: payInfo, savePay: function () { self.savePay(); },
      comInfo: comInfo, comMethods: comMethods, saveCom: function () { self.saveCom(); },
      sobrePrev: sobrePrev, saveSobre: function () { self.saveSobre(); },
      buyRows: buyRows, buyTotal: bs(buyTotal), addRow: function () { self.setF('items', items.concat([{ productId: 'p1', qty: '1', cost: String(s.products[0].cost) }])); },
      saveCompra: function () { self.saveCompra(); },
      toast: s.toast, hasToast: !!s.toast
    };
  }
}
